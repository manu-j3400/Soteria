name: Soteria Middleware CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --quiet -r backend/requirements.txt

      - name: Run tests
        env:
          JWT_SECRET: ci-test-secret
          MAKE_WEBHOOK_SECRET: ci-test-secret
        run: |
          python -m pytest tests/ backend/tests/ -v --tb=short \
            -k "not (TestAutomation or test_analyze_syntax_error_code)"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .pytest_cache/
          if-no-files-found: ignore
          retention-days: 14

  mypy:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install mypy
        run: pip install --quiet mypy

      - name: Type check middleware
        run: mypy middleware/app.py --ignore-missing-imports --no-error-summary

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, mypy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
